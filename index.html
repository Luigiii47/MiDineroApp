<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === CONFIGURACIÓN: pega aquí los datos de tu proyecto Supabase (Project Settings > API) ===
const SUPABASE_URL='https://cemkgxysqwmoaptwaqdw.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlbWtneHlzcXdtb2FwdHdhcWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MjQwNjcsImV4cCI6MjEwODEwMDA2N30.HDZrn9SSN6aL5Wh6M7ec2Vrm8jeTwetTq9FJ1XtmIZM';
const U=()=>'x'+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({accounts:[{id:'a1',name:'Tarjeta',ini:0},{id:'a2',name:'Efectivo',ini:0}],
cats:[['Comida','out'],['Transporte','out'],['Vivienda','out'],['Ocio','out'],['Suscripciones','out'],['Salud','out'],['Nómina','in'],['Ingresos extra','in']].map(c=>({id:U(),name:c[0],type:c[1]})),
tx:[],goals:[],cur:'ARS',sd:1});
let S=seed();

let nf;const setNf=()=>nf=new Intl.NumberFormat('es-ES',{style:'currency',currency:S.cur});
const fm=n=>`<span class="amt">${nf.format(n)}</span>`;
const dt=s=>new Date(s),p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
const fd=s=>dt(s).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+', '+p2(dt(s).getHours())+':'+p2(dt(s).getMinutes());
const fs=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
const cn=id=>(S.cats.find(c=>c.id==id)||{name:'Sin categoría'}).name;
const an=id=>(S.accounts.find(c=>c.id==id)||{name:'—'}).name;
const bal=a=>S.tx.reduce((s,t)=>{if(t.type=='in'&&t.acc==a.id)s+=t.amt;if(t.type=='out'&&t.acc==a.id)s-=t.amt;if(t.type=='goal'&&t.acc==a.id)s-=t.amt;if(t.type=='tr'){if(t.acc==a.id)s-=t.amt;if(t.to==a.id)s+=t.amt}return s},a.ini);
const gs=g=>S.tx.filter(t=>t.type=='goal'&&t.goal==g.id).reduce((s,t)=>s+t.amt,0);
const inR=(t,s,e,acc)=>dt(t.date)>=s&&dt(t.date)<e&&(!acc||acc=='all'||t.acc==acc);
const sum=(ty,s,e,acc,cat)=>S.tx.filter(t=>t.type==ty&&inR(t,s,e,acc)&&(!cat||t.cat==cat)).reduce((a,t)=>a+t.amt,0);
const rng=n=>{const d=S.sd,N=new Date(),y=N.getFullYear();let m=N.getMonth();if(N.getDate()<d)m--;const f=k=>new Date(y,m+k,d);return[f(1-n),f(1),f(1-2*n),f(1-n)]};
const V={page:'home',f:'all',q:'',mode:'list',cal:new Date(),day:null,n:1,acc:'all',hide:false};let F,MK;
const opts=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join('');

function row(t){const o=t.type=='in',x=t.type=='out',ic=o?'+':x?'−':t.type=='goal'?'◇':'⇄';
const sub=t.type=='tr'?`Traspaso · ${an(t.acc)} → ${an(t.to)}`:t.type=='goal'?`Objetivo · ${an(t.acc)}`:`${cn(t.cat)} · ${an(t.acc)}${t.rec?' · ↻':''}`;
const nm=t.type=='tr'?'Traspaso':t.type=='goal'?'Aporte a objetivo':esc(t.desc);
return `<div class="tx" data-a="edit" data-id="${t.id}"><div class="ic ${o?'up':x?'dn':''}">${ic}</div><div class="m"><b>${nm}</b><span class="mu">${fd(t.date)} · ${sub}</span></div><b class="${o?'up':x?'dn':''}">${o?'+':x?'−':''}${fm(t.amt)}</b></div>`}

function home(){const[s,e]=rng(1),inc=sum('in',s,e),exp=sum('out',s,e),cs=S.accounts.reduce((a,x)=>a+bal(x),0),gt=S.goals.reduce((a,g)=>a+gs(g),0);
const last=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
return `<div class="top"><div><h1>Mi<span>Dinero</span></h1><div class="sub">Tus finanzas, bajo control</div></div><div class="av">${ini()}</div></div><button class="btn ghost" style="margin-bottom:22px" data-a="hide">${V.hide?'Mostrar':'Ocultar'} importes</button>
<div class="grid"><div><div class="sub">Tu patrimonio</div><div class="big">${fm(cs+gt)}</div>
<div class="grid" style="margin-top:14px"><div><div class="mu">En tus cuentas</div><b>${fm(cs)}</b></div><div><div class="mu">En objetivos</div><b>${fm(gt)}</b></div></div></div>
<div class="card"><div class="row sp"><h3>Tu mes</h3><span class="mu">${fs(s).replace(/ \d{4}/,'')} – ${fs(new Date(e-864e5))}</span></div>
<div class="grid"><div><div class="mu">Ingresos</div><b class="up" style="font-size:20px">${fm(inc)}</b></div><div><div class="mu">Gastos</div><b class="dn" style="font-size:20px">${fm(exp)}</b></div></div>
<div class="bar r"><i style="width:${inc?Math.min(100,exp/inc*100):exp?100:0}%"></i></div><div class="mu">${inc?`Has usado el ${Math.round(exp/inc*100)}% de tus ingresos.`:'Aún no hay ingresos este mes.'}</div>
<div class="row sp" style="margin-top:12px"><span>Resultado del mes</span><b class="${inc-exp>=0?'up':'dn'}" style="font-size:20px">${fm(inc-exp)}</b></div></div></div>
<div class="row sp" style="margin:22px 0 8px"><div class="sec" style="margin:0">Tus cuentas</div><button class="btn ghost sm" data-a="form" data-v="tr">⇄ Mover</button></div>
<div class="scroll">${S.accounts.map(a=>`<div class="card"><b>${esc(a.name)}</b><div class="big" style="font-size:28px">${fm(bal(a))}</div><div class="mu">Saldo actual</div></div>`).join('')||'<div class="mu">Crea una cuenta en Ajustes.</div>'}</div>
<div class="grid" style="margin-top:22px"><div><div class="row sp"><div class="sec">Últimos movimientos</div><a class="mu" href="#" data-a="go" data-v="mov">Ver todos</a></div><div class="card list">${last.map(row).join('')||'<div class="tx mu">Sin movimientos. Pulsa “Nuevo movimiento” para empezar.</div>'}</div></div>
<div><div class="row sp"><div class="sec">Objetivos de ahorro</div><a class="mu" href="#" data-a="set" data-v="goal">Gestionar</a></div>${goals()}</div></div>`}

function goals(){return S.goals.map(g=>{const v=gs(g)+(g.ini||0),pc=g.target?Math.min(100,v/g.target*100):0;
return `<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${esc(g.name)}</b><b class="up">${Math.round(pc)}%</b></div><div class="bar"><i style="width:${pc}%"></i></div><div class="row sp"><b>${fm(v)}</b><span class="mu">Faltan ${fm(Math.max(0,g.target-v))}</span></div><button class="btn ghost sm" style="width:100%;margin-top:10px" data-a="contrib" data-id="${g.id}">Aportar desde una cuenta</button></div>`}).join('')||'<div class="card mu">Crea tu primer objetivo desde Ajustes.</div>'}

function list(){const q=V.q.toLowerCase();return[...S.tx].filter(t=>(V.f=='all'||(V.f=='rec'?t.rec:t.type==V.f))&&(!q||(t.desc||'').toLowerCase().includes(q)||cn(t.cat).toLowerCase().includes(q)||an(t.acc).toLowerCase().includes(q))&&(!V.day||t.date.slice(0,10)==V.day)).sort((a,b)=>b.date.localeCompare(a.date))}
function mov(){const cal=V.mode=='cal';if(cal){V.f='all';V.q='';if(!V.day)V.day=iso(new Date()).slice(0,10)}const L=list(),i=L.filter(t=>t.type=='in').reduce((a,t)=>a+t.amt,0),o=L.filter(t=>t.type=='out').reduce((a,t)=>a+t.amt,0);
const chips=[['all','Todos'],['in','Ingresos'],['out','Gastos'],['rec','Recurrentes']];
let body;if(cal){const d=dt(V.day+'T00:00'),tt=L.reduce((a,t)=>a+(t.type=='in'?t.amt:t.type=='out'?-t.amt:0),0);body=`<div class="row sp" style="margin:18px 0 10px"><h3 style="margin:0">${d.toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</h3><b class="${tt>=0?'up':'dn'}">${L.length?fm(tt):'Sin movimientos'}</b></div>${L.length?`<div class="card list lg">${L.map(row).join('')}</div>`:'<div class="card mu" style="border-style:dashed;text-align:center">No hay movimientos en este día.</div>'}`}else body=`<div class="row sp mu" style="margin-bottom:6px"><span>${L.length} movimientos${V.day?' del '+V.day:''}</span><span><b class="up">+${fm(i)}</b> <b class="dn">−${fm(o)}</b></span></div><div class="card list lg">${L.map(row).join('')||'<div class="tx mu">No hay movimientos con estos filtros.</div>'}</div>`;
return `<div class="top"><div><div class="sub">${(d=>d.charAt(0).toUpperCase()+d.slice(1))(new Date().toLocaleDateString('es-ES',{month:'long',year:'numeric'}))}</div><h1>Movimientos</h1></div><button class="btn" data-a="form">+</button></div>

return `<div class="seg">${[['out','Gasto'],['in','Ingreso'],['tr','Traspaso']].map(k=>`<button data-a="ft" data-v="${k[0]}" class="${ty==k[0]?'on':''}">${k[1]}</button>`).join('')}</div>
<label>Importe<input id="f_amt" type="number" step="0.01" inputmode="decimal" value="${F.amt}"></label>
${ty!='tr'?`<label>Concepto<input id="f_desc" value="${esc(F.desc)}"></label><label>Categoría<select id="f_cat">${opts(cs,F.cat)}</select></label>`:''}
<label>${ty=='tr'?'Desde':'Cuenta'}<select id="f_acc">${opts(S.accounts,F.acc)}</select></label>${ty=='tr'?`<label>Hacia<select id="f_to">${opts(S.accounts,F.to)}</select></label>`:''}
<label>Fecha y hora<input id="f_date" type="datetime-local" value="${F.date}"></label>${ty!='tr'?`<label class="chk"><input id="f_rec" type="checkbox" ${F.rec?'checked':''}> Recurrente (se repite cada mes)</label>`:''}
<div class="row"><button class="btn" data-a="fsave">Guardar movimiento</button>${F.id?'<button class="btn ghost" data-a="fdel">Eliminar</button>':''}</div><div id="err" class="dn" style="margin-top:8px"></div>`}
function sync(){const g=i=>document.getElementById(i);if(g('f_amt'))F.amt=g('f_amt').value;if(g('f_desc'))F.desc=g('f_desc').value;if(g('f_cat'))F.cat=g('f_cat').value;if(g('f_acc'))F.acc=g('f_acc').value;if(g('f_to'))F.to=g('f_to').value;if(g('f_date'))F.date=g('f_date').value;if(g('f_rec'))F.rec=g('f_rec').checked}
function openForm(id,ty){if(!S.accounts.length){alert('Primero crea una cuenta en Ajustes.');return}
F=id?{...S.tx.find(x=>x.id==id)}:{type:ty||'out',amt:'',desc:'',acc:S.accounts[0].id,to:(S.accounts[1]||S.accounts[0]).id,date:iso(new Date()),rec:false};
F.cat=F.cat||(S.cats.find(c=>c.type==F.type)||{}).id;modal(id?'Editar movimiento':'Nuevo movimiento',fh())}
function fsave(){sync();const a=parseFloat(F.amt),e=m=>document.getElementById('err').textContent=m;
if(!(a>0))return e('Escribe un importe mayor que 0.');if(F.type!='tr'&&!F.desc.trim())return e('Escribe un concepto.');if(F.type!='tr'&&!F.cat)return e('Crea una categoría en Ajustes.');if(F.type=='tr'&&F.acc==F.to)return e('Elige cuentas distintas.');if(!F.date)return e('Indica la fecha.');
const t={id:F.id||U(),type:F.type,amt:a,desc:F.desc.trim(),cat:F.type=='tr'?'':F.cat,acc:F.acc,to:F.type=='tr'?F.to:'',date:F.date,rec:F.type=='tr'?false:F.rec};
const i=S.tx.findIndex(x=>x.id==t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);save();close();render()}

function sm(k){MK=k;const L={acc:S.accounts,cat:S.cats,goal:S.goals}[k],T={acc:'Cuentas',cat:'Categorías',goal:'Objetivos de ahorro'}[k];
const rows=L.map(x=>`<div class="r"><input data-k="${k}" data-id="${x.id}" data-f="name" value="${esc(x.name)}">${k=='acc'?`<input type="number" step="0.01" style="max-width:110px" title="Saldo inicial" data-k="acc" data-id="${x.id}" data-f="ini" value="${x.ini}">`:k=='goal'?`<input type="number" step="0.01" style="max-width:110px" title="Meta" data-k="goal" data-id="${x.id}" data-f="target" value="${x.target}">`:`<span class="mu" style="align-self:center;min-width:60px">${x.type=='in'?'Ingreso':'Gasto'}</span>`}<button class="btn ghost sm" data-a="del" data-k="${k}" data-id="${x.id}">✕</button></div>`).join('');
const hint={acc:'Nombre y saldo inicial',cat:'Nombre',goal:'Nombre y meta'}[k];
modal(T,`<div class="mu" style="margin-bottom:8px">${hint}</div>${rows||'<div class="mu">Aún no hay nada.</div>'}<div class="mu" style="margin:14px 0 6px">Añadir nuevo</div><div class="r"><input id="n_name" placeholder="Nombre">${k=='cat'?'<select id="n_ty" style="max-width:110px"><option value="out">Gasto</option><option value="in">Ingreso</option></select>':`<input id="n_n" type="number" step="0.01" placeholder="${k=='acc'?'Saldo':'Meta'}" style="max-width:110px">`}<button class="btn sm" data-a="add" data-k="${k}">Añadir</button></div>`)}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el){if(ev.target.id=='m')close();return}ev.preventDefault();const a=el.dataset.a,v=el.dataset.v,id=el.dataset.id,k=el.dataset.k;
if(a=='go'){V.page=v;V.day=null;render();scrollTo(0,0)}else if(a=='form')openForm(null,v);else if(a=='edit')openForm(id);else if(a=='close')close();
else if(a=='ft'){sync();F.type=v;F.cat=(S.cats.find(c=>c.type==v)||{}).id;document.getElementById('mb').querySelector('.seg').parentNode.innerHTML=`<div class="row sp" style="margin-bottom:12px"><h3 style="margin:0">${F.id?'Editar movimiento':'Nuevo movimiento'}</h3><button class="btn ghost sm" data-a="close">✕</button></div>`+fh()}
else if(a=='fsave')fsave();else if(a=='fdel'){S.tx=S.tx.filter(x=>x.id!=F.id);save();close();render()}
else if(a=='hide'){V.hide=!V.hide;render()}else if(a=='mode'){V.mode=v;V.day=null;render()}else if(a=='chip'){V.f=v;render()}
else if(a=='cm'){V.cal=new Date(V.cal.getFullYear(),V.cal.getMonth()+ +v,1);V.day=null;render()}else if(a=='day'){V.day=v;render()}
else if(a=='per'){V.n=+v;render()}else if(a=='atab'){V.at=v;render()}else if(a=='rec'){V.page='mov';V.mode='list';V.f='rec';V.day=null;render();scrollTo(0,0)}else if(a=='set')sm(v);
else if(a=='add'){const n=document.getElementById('n_name').value.trim();if(!n)return;const x=parseFloat((document.getElementById('n_n')||{}).value)||0;
if(k=='acc')S.accounts.push({id:U(),name:n,ini:x});else if(k=='goal')S.goals.push({id:U(),name:n,target:x,ini:0});else S.cats.push({id:U(),name:n,type:document.getElementById('n_ty').value});save();sm(k);render()}
else if(a=='del'){if(k=='acc'){if(S.tx.some(t=>t.acc==id||t.to==id)){alert('Esta cuenta tiene movimientos. Elimínalos o muévelos antes de borrarla.');return}S.accounts=S.accounts.filter(x=>x.id!=id)}
else if(k=='cat')S.cats=S.cats.filter(x=>x.id!=id);else{S.goals=S.goals.filter(x=>x.id!=id);S.tx=S.tx.filter(t=>t.goal!=id)}save();sm(k);render()}
else if(a=='contrib'){modal('Aportar a objetivo',`<label>Desde la cuenta<select id="c_acc">${opts(S.accounts)}</select></label><label>Importe<input id="c_amt" type="number" step="0.01" inputmode="decimal"></label><button class="btn" data-a="cok" data-id="${id}">Aportar</button>`)}
else if(a=='cok'){const m=parseFloat(document.getElementById('c_amt').value);if(!(m>0)||!S.accounts.length)return;S.tx.push({id:U(),type:'goal',goal:id,amt:m,acc:document.getElementById('c_acc').value,date:iso(new Date()),desc:'',cat:'',rec:false});save();close();render()}
else if(a=='csv'){const c=['fecha,tipo,concepto,categoria,cuenta,importe',...S.tx.map(t=>[t.date,t.type,'"'+(t.desc||'').replace(/"/g,'""')+'"',cn(t.cat),an(t.acc),t.amt].join(','))].join('\n');
modal('Exportar a CSV',`<p class="mu">Copia este texto y pégalo en un archivo .csv o en tu hoja de cálculo.</p><textarea id="csvt" readonly>${esc(c)}</textarea><button class="btn" style="margin-top:10px" data-a="cp">Copiar</button>`)}
else if(a=='cp'){const t=document.getElementById('csvt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}el.textContent='Copiado'}
else if(a=='wipe'){modal('¿Borrar todo?','<p>Se eliminarán cuentas, movimientos y objetivos de tu cuenta. No se puede deshacer.</p><div class="row"><button class="btn" data-a="wipe2">Sí, borrar todo</button><button class="btn ghost" data-a="close">Cancelar</button></div>')}
else if(a=='logout'){sb.auth.signOut()}else if(a=='wipe2'){S=seed();save();close();render()}});
document.addEventListener('input',ev=>{if(ev.target.id=='q'){V.q=ev.target.value;const p=ev.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.k){const L={acc:S.accounts,cat:S.cats,goal:S.goals}[d.k],x=L.find(y=>y.id==d.id);if(x){x[d.f]=d.f=='name'?t.value.trim()||x.name:parseFloat(t.value)||0;save();render()}}
else if(t.id=='scur'){S.cur=t.value;save();render()}else if(t.id=='ssd'){S.sd=+t.value;save();render()}else if(t.id=='aacc'){V.acc=t.value;render()}});
const sb=(window.supabase&&!SUPABASE_URL.startsWith('PEGA'))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let USER=null,P0={},mode='in',REC=false,LOADED=false,svT;
const $=i=>document.getElementById(i);
const ini=()=>String(P0.first_name||(USER&&USER.email)||'?')[0].toUpperCase();
const tr=m=>({'Invalid login credentials':'Email o contraseña incorrectos.','User already registered':'Ese email ya está registrado.','Email not confirmed':'Confirma tu email antes de entrar (revisa tu correo).','Password should be at least 6 characters.':'La contraseña es demasiado corta.'})[m]||m;
function setSync(t){const el=$('sync');el.textContent=t;el.classList.add('on');if(t=='Guardado')setTimeout(()=>el.classList.remove('on'),1500)}
function save(){if(!USER||!LOADED)return;clearTimeout(svT);setSync('Guardando…');svT=setTimeout(async()=>{const{error}=await sb.from('user_data').upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()});setSync(error?'Error al guardar: '+error.message:'Guardado')},500)}
async function load(){
  const{data,error}=await sb.from('user_data').select('data').eq('user_id',USER.id).maybeSingle();
  if(error){$('app').innerHTML=`<div class="card"><b>No se pudieron cargar tus datos.</b><div class="mu">${esc(error.message)}. ¿Ejecutaste schema.sql en Supabase?</div></div>`;return false}
  S=data&&data.data&&data.data.accounts?data.data:seed();
  const p=await sb.from('profiles').select('first_name,last_name').eq('id',USER.id).maybeSingle();P0=p.data||{};
  LOADED=true;if(!data)save();return true}
async function start(){if(!REC)$('auth').classList.remove('open');if(await load())render()}
function authUI(msg){
  const A=$('auth');A.classList.add('open');
  if(!sb){A.innerHTML='<div class="ab"><h2>Falta configurar Supabase</h2><p class="mu">Abre index.html y pega tu SUPABASE_URL y tu SUPABASE_ANON_KEY al inicio del script. Mira el README.</p></div>';return}
  const up=mode=='up';
  A.innerHTML=`<div class="ab"><div class="brand"><i>MD</i><div><b>Mi Dinero</b><small>Tu espacio personal</small></div></div><h2>${up?'Crear cuenta':'Entrar a tu cuenta'}</h2>
<form id="af">${up?'<div class="r"><input id="a_n" placeholder="Nombre" required autocomplete="given-name"><input id="a_l" placeholder="Apellido" required autocomplete="family-name"></div>':''}
<input id="a_e" type="email" placeholder="Email" required autocomplete="email"><input id="a_p" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required autocomplete="${up?'new-password':'current-password'}">
<div id="a_m" class="mu" style="margin:10px 0;min-height:20px">${esc(msg||'')}</div><button id="a_b" class="btn" style="width:100%">${up?'Crear cuenta':'Entrar'}</button></form>
<p class="mu" style="text-align:center;margin-top:16px">${up?'¿Ya tienes cuenta? <a href="#" id="a_sw">Entrar</a>':'¿Primera vez? <a href="#" id="a_sw">Crear cuenta</a> · <a href="#" id="a_fp">Olvidé mi contraseña</a>'}</p></div>`;
  $('a_sw').onclick=e=>{e.preventDefault();mode=up?'in':'up';authUI()};
  if($('a_fp'))$('a_fp').onclick=async e=>{e.preventDefault();const em=$('a_e').value.trim();if(!em){$('a_m').textContent='Escribe tu email arriba y vuelve a pulsar.';return}
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$('a_m').textContent='Si el email existe, te enviamos un enlace para cambiar la contraseña.'};
  $('af').onsubmit=async e=>{e.preventDefault();const em=$('a_e').value.trim(),pw=$('a_p').value;$('a_b').disabled=true;
    if(!up){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)authUI(tr(error.message));return}
    const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{first_name:$('a_n').value.trim(),last_name:$('a_l').value.trim()}}});
    if(error){authUI(tr(error.message));return}
    if(!data.session){mode='in';authUI('Cuenta creada. Revisa tu correo para confirmarla y luego entra.')}}}
function recoverUI(){
  const A=$('auth');A.classList.add('open');
  A.innerHTML='<div class="ab"><h2>Nueva contraseña</h2><form id="rf"><input id="r_p" type="password" minlength="8" required placeholder="Nueva contraseña"><div id="r_m" class="mu" style="margin:10px 0;min-height:20px"></div><button class="btn" style="width:100%">Guardar</button></form></div>';
  $('rf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.updateUser({password:$('r_p').value});if(error){$('r_m').textContent=tr(error.message);return}
    REC=false;A.classList.remove('open');if(USER){if(await load())render()}}}
if(!sb)authUI();else sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev=='PASSWORD_RECOVERY'){REC=true;recoverUI()}
  if(ses&&ses.user){if(!USER||USER.id!=ses.user.id){USER=ses.user;setTimeout(start,0)}}
  else if(ev=='SIGNED_OUT'||ev=='INITIAL_SESSION'){USER=null;LOADED=false;S=seed();$('app').innerHTML='';$('nav').innerHTML='';mode='in';authUI()}
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
